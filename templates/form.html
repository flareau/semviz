<!doctype html>
<head>
  <meta charset="UTF-8">
</head>
<body>
  <h1>Formule à convertir</h1>
  <form method="POST" accept-charset="utf-8" >
    <textarea name="formula" rows="5" cols="80"></textarea>
    <br/>
    <select name="format">
      <option value="print">Afficher sur la page</option>
      <option value="pdf">Convertir en PDF</option>
      <option value="jpg">Convertir en JPG</option>
      <option value="dot">Convertir en DOT</option>
    </select>
    <input type="submit" value="Convertir" download="graph">
  </form>
</body>
